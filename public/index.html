<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recibo de Caja Menor</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="page-wrapper">
            <div class="receipt-container">
                <!-- Encabezado / Header -->
                <div class="receipt-header">
                    <div class="brand-box">
                        <div class="title-main">Recibo de Caja</div>
                        <div class="brand-sub">
                            <span class="brand-name">FOLWO</span>
                            <span class="brand-ref"></span>
                        </div>
                    </div>
                </div>

                <!-- Cuerpo del recibo -->
                <div class="receipt-body">
                    <!-- Fila 1: Ciudad, Fecha y Número -->
                    <div class="row row-top">
                        <div class="field-group city-group">
                            <span class="label">Ciudad</span>
                            <input
                                id="ciudad"
                                type="text"
                                class="input-field"
                                placeholder=""
                            />
                        </div>
                        <div class="date-group">
                            <div class="date-box">
                                <span class="label-small">Día</span>
                                <input
                                    id="dia"
                                    type="text"
                                    class="input-date"
                                    maxlength="2"
                                />
                            </div>
                            <div class="date-box">
                                <span class="label-small">Mes</span>
                                <input
                                    id="mes"
                                    type="text"
                                    class="input-date"
                                    maxlength="2"
                                />
                            </div>
                            <div class="date-box">
                                <span class="label-small">Año</span>
                                <input
                                    id="ano"
                                    type="text"
                                    class="input-date"
                                    maxlength="4"
                                />
                            </div>
                        </div>
                        <div class="field-group number-group">
                            <span class="label bold-number">No.</span>
                            <input
                                id="consecutivo"
                                type="text"
                                class="input-field bold-input"
                            />
                        </div>
                    </div>

                    <!-- Fila 2: Pagado a y Valor ($) -->
                    <div class="row row-paid">
                        <div class="field-group paid-group">
                            <span class="label">Pagado a</span>
                            <input
                                id="pagado_a"
                                type="text"
                                class="input-field"
                            />
                        </div>
                        <div class="field-group amount-group">
                            <span class="label currency-symbol">$</span>
                            <input
                                id="valor"
                                type="text"
                                class="input-field amount-input"
                            />
                        </div>
                    </div>

                    <!-- Fila 3: Concepto -->
                    <div class="row row-concept">
                        <div class="field-group concept-group">
                            <span class="label">Concepto</span>
                            <input
                                id="concepto1"
                                type="text"
                                class="input-field line-input"
                            />
                            <input
                                id="concepto2"
                                type="text"
                                class="input-field line-input"
                            />
                        </div>
                    </div>

                    <!-- Fila 4: Valor en letras -->
                    <div class="row row-value-letters">
                        <div class="field-group letters-group">
                            <span class="label"
                                >Valor
                                <span class="normal-text"
                                    >(en letras)</span
                                ></span
                            >
                            <input
                                id="valor_letras"
                                type="text"
                                class="input-field line-input"
                            />
                        </div>
                    </div>

                    <!-- Fila 5: Código, Aprobado y Firma de recibido -->
                    <div class="row row-bottom">
                        <div class="left-bottom-col">
                            <div class="code-box">
                                <span class="label">Código</span>
                                <input
                                    id="codigo"
                                    type="text"
                                    class="input-field"
                                />
                            </div>
                            <div class="approved-box">
                                <span class="label green-text">Estado</span>
                                <input
                                    id="estado"
                                    type="text"
                                    class="input-field bg-transparent"
                                />
                            </div>
                        </div>
                        <div class="right-bottom-col">
                            <div class="signature-top-area">
                                <span class="label green-text">Firma de recibido</span>
                                <!-- Canvas integrado para la firma -->
                                <canvas id="signatureCanvas"></canvas>
                            </div>
                            <div class="signature-footer">
                                <span class="id-label">C.C.</span>
                                <input
                                    id="cc"
                                    type="radio"
                                    name="tipo_id"
                                    class="radio-input"
                                    required
                                />
                                <span class="id-label">NIT.</span>
                                <input
                                    id="nit"
                                    type="radio"
                                    name="tipo_id"
                                    class="radio-input"
                                    required
                                />
                                <span class="id-label">No.</span>
                                <input
                                    id="nCedula"
                                    type="text"
                                    class="input-id-number"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción Estetizados -->
            <div class="actions-container">
                <button id="guardar" type="button" class="btn btn-save">
                    Guardar
                </button>
                <button type="button" class="btn btn-clear">Limpiar</button>
                <button
                    type="button"
                    class="btn btn-print"
                    onclick="window.print()"
                >
                    Imprimir
                </button>
                <button type="button" class="btn btn-new">Nuevo</button>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/signature_pad@5.1.4/dist/signature_pad.umd.min.js"></script>
    </body>
</html>
