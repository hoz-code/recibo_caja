<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo de Caja Menor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="receipt-container">
        <!-- Encabezado / Header -->
        <div class="receipt-header">
            <div class="brand-box">
                <div class="title-main">Recibo de Caja</div>
                <div class="brand-sub">
                    <span class="brand-name"></span> <span class="brand-ref"></span>
                </div>
            </div>
        </div>

        <!-- Cuerpo del recibo -->
        <div class="receipt-body">
            <!-- Fila 1: Ciudad, Fecha y Número -->
            <div class="row row-top">
                <div class="field-group city-group">
                    <span class="label">Ciudad</span>
                    <input type="text" class="input-field" placeholder="">
                </div>
                <div class="date-group">
                    <div class="date-box">
                        <span class="label-small">Día</span>
                        <input type="text" class="input-date" maxlength="2">
                    </div>
                    <div class="date-box">
                        <span class="label-small">Mes</span>
                        <input type="text" class="input-date" maxlength="2">
                    </div>
                    <div class="date-box">
                        <span class="label-small">Año</span>
                        <input type="text" class="input-date" maxlength="4">
                    </div>
                </div>
                <div class="field-group number-group">
                    <span class="label bold-number">No.</span>
                    <input type="text" class="input-field bold-input">
                </div>
            </div>

            <!-- Fila 2: Pagado a y Valor ($) -->
            <div class="row row-paid">
                <div class="field-group paid-group">
                    <span class="label">Pagado a</span>
                    <input type="text" class="input-field">
                </div>
                <div class="field-group amount-group">
                    <span class="label currency-symbol">$</span>
                    <input type="text" class="input-field amount-input">
                </div>
            </div>

            <!-- Fila 3: Concepto -->
            <div class="row row-concept">
                <div class="field-group concept-group">
                    <span class="label">Concepto</span>
                    <input type="text" class="input-field line-input">
                    <input type="text" class="input-field line-input">
                </div>
            </div>

            <!-- Fila 4: Valor en letras -->
            <div class="row row-value-letters">
                <div class="field-group letters-group">
                    <span class="label">Valor <span class="normal-text">(en letras)</span></span>
                    <input type="text" class="input-field line-input">
                </div>
            </div>

            <!-- Fila 5: Código, Aprobado y Firma de recibido -->
            <div class="row row-bottom">
                <div class="left-bottom-col">
                    <div class="code-box">
                        <span class="label">Código</span>
                        <input type="text" class="input-field">
                    </div>
                    <div class="approved-box">
                        <span class="label green-text">Aprobado</span>
                        <input type="text" class="input-field bg-transparent">
                    </div>
                </div>
                <div class="right-bottom-col">
                    <div class="signature-title">
                        <span class="label green-text">Firma de recibido</span>
                    </div>
                    <input type="text" class="input-field signature-line">
                    <div class="signature-footer">
                        <span class="id-label">C.C.</span> <input type="checkbox" class="checkbox-input">
                        <span class="id-label">NIT.</span> <input type="checkbox" class="checkbox-input">
                        <span class="id-label">No.</span>
                        <input type="text" class="input-id-number">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
